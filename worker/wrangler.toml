name = "bytescribble-leaderboard"
main = "src/index.js"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "api.bytescribble.com", custom_domain = true }
]

# Created with: npx wrangler kv namespace create SCORES
# Paste the returned id below before deploying.
[[kv_namespaces]]
binding = "SCORES"
id = "b9374e5dde514fa299c06d614562fe25"

# Workers AI powers /chat for chats.bytescribble.com (Bolo).
# Free tier includes a daily neuron allowance; the chat client falls back to
# a retrieval-only answer if this is unavailable.
[ai]
binding = "AI"
